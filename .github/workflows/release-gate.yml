name: TDS GA7 Release Gate

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-release-gate:
    runs-on: ubuntu-latest

    steps:
      - name: "TDS identity: 23f2000333@ds.study.iitm.ac.in"
        run: |
          echo "TDS identity: 23f2000333@ds.study.iitm.ac.in"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Start release gate
        run: |
          uvicorn main:app --host 127.0.0.1 --port 8000 &

      - name: Wait for service
        run: |
          sleep 3

      - name: Run release gate tests
        run: |
          python test_release_gate.py
